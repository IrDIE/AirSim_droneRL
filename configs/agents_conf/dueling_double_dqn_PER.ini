[agent]
action_type = discrete

[infer]
load_from = logs/itmo/NH/dddqn-per/saved_weights/
logg_tb_dir = logs/itmo/NH/dddqn-per/infer/

[train]
load_from = 
gamma = 0.99
batch = 64
lr = 1e-4
buffer_size = 50000
min_replay_size = 2500
max_steps_per_episode = 500
target_update_freq = 500
epsilon_start = 0.7
epsilon_end = 0.05
epsilon_decay = 7000

[logg]
save_weights = logs/itmo/NH/dddqn-per/saved_weights/
logg_tb_dir = logs/itmo/NH/dddqn-per/
logging_interval = 50

