[agent]
action_type = discrete

[infer]
load_from = 
logg_tb_dir = logs/test/infer/ddpn_no_per2/

[train]
load_from = logs/itmo/NH/dddqn-no-per/saved_weights/
gamma = 0.99
batch = 64
lr = 1e-4
buffer_size = 50000
min_replay_size = 3000
max_steps_per_episode = 500
target_update_freq = 1000
epsilon_start = 0.75
epsilon_end = 0.05
epsilon_decay = 20000


[logg]
save_weights = logs/itmo/NH/dddqn-no-per1/saved_weights/
logg_tb_dir = logs/itmo/NH/dddqn-no-per1/
logging_interval = 100

